<script>
  /* Two sites now, so this page has to choose. It chooses on the browser's
     stated language and nothing else - not on IP, because where a person is
     is not what language they read, and a Korean owner travelling should not
     get the English page any more than a Londoner in Seoul should get the
     Korean one.

     The choice is a redirect, not a lock: every page carries a switch to the
     other language, and both are in the sitemap under their own hreflang, so
     a search engine indexes each on its own terms rather than following this
     hop. If the browser says nothing, English is the default, which is what
     x-default above declares. */
  (function () {
    var langs = navigator.languages || [navigator.language || 'en'];
    var ko = false;
    for (var i = 0; i < langs.length; i++) {
      if (/^ko\b/i.test(langs[i])) { ko = true; break; }
      if (/^[a-z]{2}\b/i.test(langs[i])) break;   /* first real preference wins */
    }
    location.replace(ko ? './ko/index.html' : './en/index.html');
  })();
</script>
